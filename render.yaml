services:
  - type: web
    name: ai-powered-portfolio
    env: python
    region: oregon
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn portfolio_project.wsgi:application
    rootDir: main_portfolio
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: False
      - key: ALLOWED_HOSTS
        value: .onrender.com,localhost,127.0.0.1
      - key: CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com
      - key: AI_SERVICE_INTERNAL_KEY
        value: d59e355c3c0a2b0b14467d55ed59e211e40562e8484196144e54823293883bfd
