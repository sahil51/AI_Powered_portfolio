version: "3.9"

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.prod
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DB_HOST=postgres
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - REDIS_SENTINEL_ENABLED=true
      - REDIS_SENTINEL_HOSTS=["redis-sentinel-1:26379","redis-sentinel-2:26379","redis-sentinel-3:26379"]
      - CELERY_REDIS_SENTINEL_ENABLED=true
    env_file:
      - ../.env
    depends_on:
      postgres:
        condition: service_healthy
      redis-sentinel-1:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M
        reservations:
          cpus: '0.5'
          memory: 256M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  celery_worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.prod
    command: celery -A infrastructure.queue.celery_app worker -l info
    environment:
      - ENVIRONMENT=production
      - DB_HOST=postgres
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - REDIS_SENTINEL_ENABLED=true
      - REDIS_SENTINEL_HOSTS=["redis-sentinel-1:26379","redis-sentinel-2:26379","redis-sentinel-3:26379"]
      - CELERY_REDIS_SENTINEL_ENABLED=true
    env_file:
      - ../.env
    depends_on:
      postgres:
        condition: service_healthy
      redis-sentinel-1:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  celery_beat:
    build:
      context: ..
      dockerfile: docker/Dockerfile.prod
    command: celery -A infrastructure.queue.celery_app beat -l info
    environment:
      - ENVIRONMENT=production
      - DB_HOST=postgres
      - REDIS_URL=redis://redis:6379/0
      - REDIS_SENTINEL_ENABLED=true
      - REDIS_SENTINEL_HOSTS=["redis-sentinel-1:26379","redis-sentinel-2:26379","redis-sentinel-3:26379"]
    env_file:
      - ../.env
    depends_on:
      postgres:
        condition: service_healthy
      redis-sentinel-1:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ai_assistant
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data_prod:/data

  redis-replica-1:
    image: redis:7-alpine
    command: redis-server --replicaof redis 6379
    depends_on:
      - redis

  redis-replica-2:
    image: redis:7-alpine
    command: redis-server --replicaof redis 6379
    depends_on:
      - redis

  redis-sentinel-1:
    image: redis:7-alpine
    ports:
      - "26379:26379"
    command: redis-sentinel /etc/redis/sentinel.conf
    volumes:
      - ./sentinel-1.conf:/etc/redis/sentinel.conf
    depends_on:
      - redis
      - redis-replica-1
      - redis-replica-2

  redis-sentinel-2:
    image: redis:7-alpine
    ports:
      - "26380:26379"
    command: redis-sentinel /etc/redis/sentinel.conf
    volumes:
      - ./sentinel-2.conf:/etc/redis/sentinel.conf
    depends_on:
      - redis
      - redis-replica-1
      - redis-replica-2

  redis-sentinel-3:
    image: redis:7-alpine
    ports:
      - "26381:26379"
    command: redis-sentinel /etc/redis/sentinel.conf
    volumes:
      - ./sentinel-3.conf:/etc/redis/sentinel.conf
    depends_on:
      - redis
      - redis-replica-1
      - redis-replica-2

  prometheus:
    image: prom/prometheus:v2.45.0
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data_prod:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

volumes:
  postgres_data_prod:
  redis_data_prod:
  prometheus_data_prod:
