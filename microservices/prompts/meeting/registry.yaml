version: "1.0"
registry_version: "1.0.0"
prompts:
  - name: meeting.confirmation
    category: meeting
    version: 1.0.0
    status: active
    description: Confirmation prompt for meeting scheduling
    tags: [meeting, confirmation]
    owner: platform
    variables:
      - name: details
        required: true

  - name: meeting.collect_information
    category: meeting
    version: 1.0.0
    status: active
    description: Meeting field collection prompt
    tags: [meeting, collection]
    owner: platform
    variables:
      - name: collected_fields
        required: true
      - name: missing_fields
        required: true
      - name: message
        required: true
